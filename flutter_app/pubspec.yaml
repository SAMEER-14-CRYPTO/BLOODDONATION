name: lifelink
description: "LifeLink – Smart Blood Donor Finder"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.1

  # UI & Utilities
  url_launcher: ^6.2.4
  fl_chart: ^0.66.2
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  uuid: ^4.2.1
  timeago: ^3.6.1

  # Firebase Packages
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
