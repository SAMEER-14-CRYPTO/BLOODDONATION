name: Backend Security Review & SAST/DAST

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-audit:
    name: Run SAST Security Review & API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install exceljs --no-audit

      - name: Generate Reports & Excel Sheets
        run: |
          node scripts/generate_all_reports.js

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Security-Review-Reports
          path: |
            Vulnerability_Test_Results/
          retention-days: 30

      - name: Publish Security Summary
        run: |
          cat Vulnerability_Test_Results/executive-summary.md >> $GITHUB_STEP_SUMMARY
