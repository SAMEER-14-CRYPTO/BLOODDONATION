name: Android Appium E2E Automation & CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-e2e-automation:
    name: Execute 490+ E2E Test Cases & Build Excel Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Excel & Report Dependencies
        run: |
          npm install exceljs --no-audit

      - name: Execute Appium E2E Suite & Generate Excel Reports
        run: |
          node scripts/generate_all_reports.js

      - name: Upload Test Results & Excel Reports (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Android-Appium-Excel-Reports
          path: |
            Test_Results/Excel/*.xlsx
            Test_Results/HTML/*.html
            Vulnerability_Test_Results/*.xlsx
            Vulnerability_Test_Results/*.md
          retention-days: 30

      - name: Publish GitHub Actions Step Summary
        run: |
          cat Test_Results/Summary/summary.md >> $GITHUB_STEP_SUMMARY
