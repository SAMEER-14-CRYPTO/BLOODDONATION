<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find blood banks near you with real-time stock status. LifeLink blood bank directory.">
  <title>Blood Banks – LifeLink</title>
  <!-- Leaflet.js – Free Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .map-ph-chips { display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px; }
    .map-ph-chip  { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
                    padding:4px 10px;font-size:0.8rem;display:flex;align-items:center;gap:6px; }
    .map-ph-dot   { width:8px;height:8px;border-radius:50%;display:inline-block; }
    .map-ph-icon  { font-size:2.5rem; }
    .map-ph-sub   { font-size:0.82rem;color:var(--text-secondary); }
  </style>
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E53935">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LifeLink">
  <link rel="apple-touch-icon" href="icons/icon-512x512.png">
  <meta name="msapplication-TileColor" content="#E53935">
  <meta name="msapplication-TileImage" content="icons/icon-512x512.png">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <div class="logo-icon">🩸</div>
        <span>Life<span class="text-primary">Link</span></span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="search.html">Find Donors</a>
        <a href="emergency.html">Emergency</a>
        <a href="hospitals.html">Hospitals</a>
        <a href="blood-banks.html" class="active">Blood Banks</a>
        <a href="about.html">About</a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
        <a href="login.html" class="btn btn-sm btn-outline auth-btn">Login</a>
        <a href="dashboard.html" class="btn btn-sm btn-primary user-btn" style="display:none">Dashboard</a>
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <span class="badge badge-primary">🏦 Blood Supply</span>
      <h1>Blood Bank <span class="text-primary">Directory</span></h1>
      <div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>Blood Banks</span></div>
    </div>
  </div>

  <section class="section" style="padding-top:40px">
    <div class="container">

      <!-- Map -->
      <div id="bloodBankMap" class="map-container" style="height:360px;margin-bottom:32px"></div>

      <!-- Title & Search Bar -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
        <h3 style="margin:0">🏦 Blood Bank & Component Centres</h3>
        <div style="font-size:0.9rem;font-weight:600;color:var(--text-secondary)">
          Showing <span id="bankCount" style="color:var(--primary);font-weight:700">0</span> Certified Centres
        </div>
      </div>

      <div style="display:flex;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap">
        <input type="text" id="bbSearch" class="form-input" style="flex:1;min-width:200px"
               placeholder="Search by blood bank name, city or district (e.g. Chennai, Tirupati, Coimbatore, Vijayawada, Vizag, Nellore, Kadapa)…">
        <button class="btn btn-primary" id="bbSearchBtn">🔍 Search</button>
        <button class="btn btn-outline" id="bbGeoBtn">📍 Near Me</button>
      </div>

      <div id="bloodBankList" class="flex flex-col gap-3"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom"><span>© 2026 LifeLink. All rights reserved.</span></div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/app.js"></script>
  <script>
    let allBanks = [];

    const BLOOD_THEMES = {
      'A+':  { bg: 'rgba(239, 83, 80, 0.09)',  text: '#d32f2f', border: 'rgba(239, 83, 80, 0.28)',  bar: 'linear-gradient(90deg, #ef5350, #e53935)' },
      'A-':  { bg: 'rgba(255, 112, 67, 0.09)', text: '#e64a19', border: 'rgba(255, 112, 67, 0.28)', bar: 'linear-gradient(90deg, #ff7043, #f4511e)' },
      'B+':  { bg: 'rgba(66, 165, 245, 0.09)', text: '#1976d2', border: 'rgba(66, 165, 245, 0.28)', bar: 'linear-gradient(90deg, #42a5f5, #1e88e5)' },
      'B-':  { bg: 'rgba(38, 198, 218, 0.09)', text: '#0097a7', border: 'rgba(38, 198, 218, 0.28)', bar: 'linear-gradient(90deg, #26c6da, #00acc1)' },
      'O+':  { bg: 'rgba(102, 187, 106, 0.09)',text: '#2e7d32', border: 'rgba(102, 187, 106, 0.28)',bar: 'linear-gradient(90deg, #66bb6a, #43a047)' },
      'O-':  { bg: 'rgba(255, 167, 38, 0.09)', text: '#ef6c00', border: 'rgba(255, 167, 38, 0.28)', bar: 'linear-gradient(90deg, #ffa726, #fb8c00)' },
      'AB+': { bg: 'rgba(171, 71, 188, 0.09)',text: '#7b1fa2', border: 'rgba(171, 71, 188, 0.28)', bar: 'linear-gradient(90deg, #ab47bc, #8e24aa)' },
      'AB-': { bg: 'rgba(126, 87, 194, 0.09)',text: '#512da8', border: 'rgba(126, 87, 194, 0.28)', bar: 'linear-gradient(90deg, #7e57c2, #5e35b1)' },
    };

    function renderBanks(banks) {
      const container = document.getElementById('bloodBankList');
      const countEl = document.getElementById('bankCount');
      if (countEl) countEl.textContent = banks.length;

      if (banks.length === 0) {
        container.innerHTML = '<div class="text-center" style="padding:40px"><p>No blood banks found for this search.</p></div>';
        return;
      }
      container.innerHTML = banks.map(b => {
        const stockBars = Object.entries(b.stocks || {}).map(([g, c]) => {
          const max = 60;
          const pct = Math.min(100, Math.round((c / max) * 100));
          const theme = BLOOD_THEMES[g] || { bg: 'rgba(229,57,53,0.08)', text: '#e53935', border: 'rgba(229,57,53,0.2)', bar: '#e53935' };
          return `
            <div style="flex:1;min-width:85px;padding:10px 8px;border-radius:12px;background:${theme.bg};border:1px solid ${theme.border};text-align:center;transition:transform 0.2s">
              <div style="font-weight:800;font-size:0.95rem;color:${theme.text};margin-bottom:6px">${g}</div>
              <div style="background:rgba(0,0,0,0.06);border-radius:6px;height:7px;overflow:hidden;margin-bottom:6px">
                <div style="width:${pct}%;height:100%;background:${theme.bar};border-radius:6px;transition:width 0.4s ease"></div>
              </div>
              <span style="font-size:0.8rem;font-weight:700;color:${theme.text}">${c} <span style="font-size:0.7rem;font-weight:500;opacity:0.85">units</span></span>
            </div>`;
        }).join('');

        return `
          <div class="card" style="padding:24px" id="bank-${b.id}">
            <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:16px;flex-wrap:wrap;gap:12px">
              <div>
                <h3 style="margin-bottom:4px">🏦 ${b.name}</h3>
                <p style="font-size:0.85rem;margin-bottom:2px">📍 ${b.address}</p>
                <p style="font-size:0.85rem">📞 ${b.contact}</p>
              </div>
              <div style="display:flex;gap:8px">
                <a href="tel:${b.contact}" class="btn btn-sm btn-primary">📞 Contact</a>
                ${b.lat ? `<button class="btn btn-sm btn-outline" onclick="focusBank('${b.id}')">📍 Map</button>` : ''}
              </div>
            </div>
            <h4 style="margin-bottom:12px;font-size:0.9rem">Blood Stock Status</h4>
            <div style="display:flex;flex-wrap:wrap;gap:12px">${stockBars}</div>
          </div>`;
      }).join('');
    }

    function focusBank(id) {
      const b = allBanks.find(x => x.id === id);
      if (b && b.lat && b.lng) Maps.setCenter({ lat: b.lat, lng: b.lng }, 15);
    }

    function filterBanks() {
      const q = document.getElementById('bbSearch').value.toLowerCase().trim();
      let list = allBanks;

      if (q) {
        list = list.filter(b =>
          b.name.toLowerCase().includes(q) || b.address.toLowerCase().includes(q)
        );
      }

      renderBanks(list);
      Maps.clearMarkers();
      Maps.addBloodBankMarkers(list);
    }

    document.addEventListener('DOMContentLoaded', () => {
      DemoData.getBloodBanks().then(banks => {
        allBanks = banks;

        LeafletLoader.load(() => {
          Maps.init('bloodBankMap', {
            center: LIFELINK_CONFIG.defaultCenter,
            zoom: LIFELINK_CONFIG.defaultZoom,
            onMapReady: () => Maps.addBloodBankMarkers(allBanks)
          });
        });

        renderBanks(allBanks);
      });

      document.getElementById('bbSearchBtn').addEventListener('click', filterBanks);
      document.getElementById('bbSearch').addEventListener('keyup', e => {
        if (e.key === 'Enter') filterBanks();
      });

      document.getElementById('bbGeoBtn').addEventListener('click', () => {
        const btn = document.getElementById('bbGeoBtn');
        btn.textContent = '⏳ Locating…'; btn.disabled = true;
        Maps.getUserLocation(coords => {
          btn.disabled = false;
          if (!coords) { btn.textContent = '📍 Near Me'; return; }
          Maps.setCenter(coords, 12);
          Maps.addUserLocationMarker(coords.lat, coords.lng);
          btn.textContent = '✅ Located';
          App.showToast('Showing blood banks near your location', 'success');
        });
      });
    });
  </script>
</body>
</html>
