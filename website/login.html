<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to LifeLink. Access your donor dashboard, receiver search, or admin control panel.">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="css/main.css">
  <style>
    html, body, input, .form-input, select, textarea {
      color-scheme: dark !important;
    }
    body {
      background-color: #111422 !important;
      background-image: radial-gradient(circle at 10% 20%, rgba(229,57,53,0.08) 0%, transparent 40%), 
                        radial-gradient(circle at 90% 80%, rgba(30,136,229,0.08) 0%, transparent 40%) !important;
      color: #ffffff !important;
      min-height: 100vh;
    }
    .navbar {
      background: rgba(17, 20, 34, 0.85) !important;
      border-bottom: 1px solid #1c2035 !important;
      backdrop-filter: blur(10px);
    }
    .navbar .nav-links a {
      color: #8c90aa !important;
    }
    .navbar .nav-links a:hover, .navbar .nav-links a.active {
      color: #ffffff !important;
      background: rgba(229, 57, 53, 0.15) !important;
    }
    .login-card {
      background: #191c2e !important;
      border: 1px solid #242942 !important;
      border-radius: 28px !important;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45) !important;
      padding: 38px 34px !important;
      position: relative;
    }
    .text-center h2 {
      color: #ffffff !important;
      font-size: 2.1rem !important;
      font-weight: 800 !important;
      letter-spacing: -0.03em !important;
      margin-bottom: 6px !important;
    }
    .text-center p {
      color: #8c90aa !important;
      font-size: 0.95rem !important;
    }

    /* Role selection tabs: Donor vs Receiver vs Admin */
    .role-tabs {
      display: flex;
      background: #111422;
      border: 1px solid #242942;
      border-radius: 50px;
      padding: 5px;
      margin-bottom: 22px;
      gap: 4px;
    }
    .role-tab {
      flex: 1;
      text-align: center;
      padding: 12px 10px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #8c90aa;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .role-tab.active {
      background: #e53935;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(229, 57, 53, 0.4);
    }
    .role-tab.active.receiver-active {
      background: #43A047;
      box-shadow: 0 4px 15px rgba(67, 160, 71, 0.4);
    }
    .role-tab.active.admin-active {
      background: #1e88e5;
      box-shadow: 0 4px 15px rgba(30, 136, 229, 0.4);
    }
    .role-tab:not(.active):hover {
      color: #ffffff;
      background: rgba(255,255,255,0.06);
    }
    .role-tab:active {
      transform: scale(0.95);
    }

    /* Form controls */
    .form-group label {
      color: #ffffff !important;
      font-weight: 600 !important;
      font-size: 0.9rem !important;
      margin-bottom: 8px !important;
      display: block !important;
      text-align: left !important;
    }
    .form-input {
      background: #111422 !important;
      background-color: #111422 !important;
      border: 1px solid #242942 !important;
      border-radius: 14px !important;
      color: #ffffff !important;
      padding: 14px 18px !important;
      font-size: 0.95rem !important;
      transition: border-color 0.25s ease, box-shadow 0.25s ease !important;
      width: 100%;
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }
    .form-input:focus {
      border-color: #e53935 !important;
      box-shadow: 0 0 0 3px rgba(229, 57, 53, 0.25) !important;
      background: #111422 !important;
      background-color: #111422 !important;
      outline: none !important;
    }
    .form-input.receiver-focus:focus {
      border-color: #43A047 !important;
      box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.25) !important;
      background: #111422 !important;
      background-color: #111422 !important;
      outline: none !important;
    }
    .form-input.admin-focus:focus {
      border-color: #1e88e5 !important;
      box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.25) !important;
      background: #111422 !important;
      background-color: #111422 !important;
      outline: none !important;
    }
    .form-input::placeholder {
      color: #494c63 !important;
    }

    /* Remove browser & Android autofill yellowish tone completely */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active,
    input:-internal-autofill-previewed,
    input:-internal-autofill-selected,
    input:autofill,
    input:autofill:hover,
    input:autofill:focus,
    input:autofill:active,
    .form-input:-webkit-autofill,
    .form-input:-webkit-autofill:hover, 
    .form-input:-webkit-autofill:focus, 
    .form-input:-webkit-autofill:active,
    .form-input:-internal-autofill-previewed,
    .form-input:-internal-autofill-selected,
    .form-input:autofill,
    .form-input:autofill:hover,
    .form-input:autofill:focus,
    .form-input:autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #111422 inset !important;
      box-shadow: 0 0 0 1000px #111422 inset !important;
      -webkit-text-fill-color: #ffffff !important;
      caret-color: #ffffff !important;
      color: #ffffff !important;
      background-color: #111422 !important;
      background-image: none !important;
      border: 1px solid #242942 !important;
      outline: none !important;
      transition: background-color 5000000s ease-in-out 0s, color 5000000s ease-in-out 0s, -webkit-box-shadow 5000000s ease-in-out 0s !important;
    }
    input:-webkit-autofill:focus,
    input:autofill:focus,
    .form-input:-webkit-autofill:focus,
    .form-input:autofill:focus {
      border-color: #e53935 !important;
      -webkit-box-shadow: 0 0 0 1000px #111422 inset, 0 0 0 3px rgba(229, 57, 53, 0.25) !important;
      box-shadow: 0 0 0 1000px #111422 inset, 0 0 0 3px rgba(229, 57, 53, 0.25) !important;
      outline: none !important;
    }
    input.receiver-focus:-webkit-autofill:focus,
    input.receiver-focus:autofill:focus,
    .form-input.receiver-focus:-webkit-autofill:focus,
    .form-input.receiver-focus:autofill:focus {
      border-color: #43A047 !important;
      -webkit-box-shadow: 0 0 0 1000px #111422 inset, 0 0 0 3px rgba(67, 160, 71, 0.25) !important;
      box-shadow: 0 0 0 1000px #111422 inset, 0 0 0 3px rgba(67, 160, 71, 0.25) !important;
      outline: none !important;
    }
    input.admin-focus:-webkit-autofill:focus,
    input.admin-focus:autofill:focus,
    .form-input.admin-focus:-webkit-autofill:focus,
    .form-input.admin-focus:autofill:focus {
      border-color: #1e88e5 !important;
      -webkit-box-shadow: 0 0 0 1000px #111422 inset, 0 0 0 3px rgba(30, 136, 229, 0.25) !important;
      box-shadow: 0 0 0 1000px #111422 inset, 0 0 0 3px rgba(30, 136, 229, 0.25) !important;
      outline: none !important;
    }

    /* Primary Login Button */
    .btn-login-main {
      background: #e53935 !important;
      border: none !important;
      color: #ffffff !important;
      border-radius: 50px !important;
      padding: 15px !important;
      font-weight: 700 !important;
      font-size: 1.05rem !important;
      box-shadow: 0 4px 18px rgba(229, 57, 53, 0.4) !important;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      width: 100%;
      margin-top: 14px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-login-main.btn-receiver {
      background: #43A047 !important;
      box-shadow: 0 4px 18px rgba(67, 160, 71, 0.4) !important;
    }
    .btn-login-main.btn-admin {
      background: #1e88e5 !important;
      box-shadow: 0 4px 18px rgba(30, 136, 229, 0.4) !important;
    }
    .btn-login-main:hover {
      transform: translateY(-2px) scale(1.01) !important;
      filter: brightness(1.1);
    }
    .btn-login-main:active {
      transform: scale(0.96) !important;
      filter: brightness(0.95);
    }
    .btn-login-main:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none !important;
    }
  </style>
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E53935">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LifeLink">
  <link rel="apple-touch-icon" href="icons/icon-512x512.png">
  <meta name="msapplication-TileColor" content="#E53935">
  <meta name="msapplication-TileImage" content="icons/icon-512x512.png">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>
  <nav class="navbar"><div class="container"><a href="index.html" class="nav-brand"><div class="logo-icon">🩸</div><span>Life<span class="text-primary">Link</span></span></a><div class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="search.html">Find Donors</a><a href="emergency.html">Emergency</a><a href="hospitals.html">Hospitals</a><a href="about.html">About</a></div><div class="nav-actions"><button class="theme-toggle" id="themeToggle">🌙</button><button class="hamburger" id="hamburger"><span></span><span></span><span></span></button></div></div></nav>

  <section class="section" style="min-height:100vh;display:flex;align-items:center;padding:90px 0 40px">
    <div class="container" style="max-width:460px">
      <div class="login-card">
        <div class="text-center" style="margin-bottom:16px">
          <div style="font-size:2.8rem;margin-bottom:4px" id="roleIcon">🩸</div>
          <h2>Welcome Back</h2>
          <p id="roleSubtitle" style="margin-bottom:10px">Sign in as a Blood Donor to continue</p>
        </div>

        <!-- 3 Distinct Tabs: Donor | Receiver | Admin -->
        <div class="role-tabs">
          <button type="button" class="role-tab active" id="donorTabBtn" onclick="switchLoginRole('donor')">
            <span>🩸</span> Donor
          </button>
          <button type="button" class="role-tab" id="receiverTabBtn" onclick="switchLoginRole('receiver')">
            <span>🔍</span> Receiver
          </button>
          <button type="button" class="role-tab" id="adminTabBtn" onclick="switchLoginRole('admin')">
            <span>🔐</span> Admin
          </button>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
          <input type="hidden" id="loginRole" value="donor">
          
          <div class="form-group" style="margin-bottom:14px">
            <label for="loginEmail" id="emailLabel">Email Address</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="donor@email.com" required autocomplete="email">
          </div>
          
          <div class="form-group" style="margin-bottom:18px">
            <label for="loginPassword" id="passwordLabel">Password</label>
            <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required minlength="8" maxlength="12" autocomplete="current-password">
          </div>
          
          <button type="submit" class="btn btn-login-main" id="submitLoginBtn">
            🩸 Login as Donor
          </button>
        </form>

        <p style="text-align:center;margin-top:18px;font-size:0.9rem;color:#8c90aa" id="registerPrompt">
          New here? <a href="register.html" style="color:#e53935;font-weight:700">Register as Donor or Receiver</a>
        </p>
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Switch between Donor, Receiver & Admin Login
    function switchLoginRole(role) {
      document.getElementById('loginRole').value = role;
      
      const donorBtn = document.getElementById('donorTabBtn');
      const receiverBtn = document.getElementById('receiverTabBtn');
      const adminBtn = document.getElementById('adminTabBtn');
      const subtitle = document.getElementById('roleSubtitle');
      const icon = document.getElementById('roleIcon');
      const emailInput = document.getElementById('loginEmail');
      const submitBtn = document.getElementById('submitLoginBtn');
      const emailLabel = document.getElementById('emailLabel');
      const regPrompt = document.getElementById('registerPrompt');

      // Reset all tabs
      [donorBtn, receiverBtn, adminBtn].forEach(btn => {
        btn.classList.remove('active', 'receiver-active', 'admin-active');
      });

      // Remove focus class from inputs
      emailInput.classList.remove('receiver-focus', 'admin-focus');
      document.getElementById('loginPassword').classList.remove('receiver-focus', 'admin-focus');

      if (role === 'donor') {
        donorBtn.classList.add('active');
        icon.textContent = '🩸';
        subtitle.textContent = 'Sign in as a Blood Donor to continue';
        emailLabel.textContent = 'Donor Email Address';
        emailInput.placeholder = 'donor@email.com';
        submitBtn.innerHTML = '🩸 Login as Donor';
        submitBtn.className = 'btn btn-login-main';
        if (regPrompt) {
          regPrompt.style.display = 'block';
          regPrompt.innerHTML = 'New here? <a href="register.html" style="color:#e53935;font-weight:700">Register as Donor or Receiver</a>';
        }
      } else if (role === 'receiver') {
        receiverBtn.classList.add('active', 'receiver-active');
        icon.textContent = '🔍';
        subtitle.textContent = 'Sign in to find blood donors near you';
        emailLabel.textContent = 'Receiver Email Address';
        emailInput.placeholder = 'receiver@email.com';
        submitBtn.innerHTML = '🔍 Login as Receiver';
        submitBtn.className = 'btn btn-login-main btn-receiver';
        emailInput.classList.add('receiver-focus');
        document.getElementById('loginPassword').classList.add('receiver-focus');
        if (regPrompt) {
          regPrompt.style.display = 'block';
          regPrompt.innerHTML = 'Need blood? <a href="register.html?role=receiver" style="color:#43A047;font-weight:700">Register as Receiver</a>';
        }
      } else {
        adminBtn.classList.add('active', 'admin-active');
        icon.textContent = '🔐';
        subtitle.textContent = 'Sign in to Admin Control Center';
        emailLabel.textContent = 'Admin Email Address';
        emailInput.placeholder = 'admin@lifelink.com';
        submitBtn.innerHTML = '🔐 Login as Admin';
        submitBtn.className = 'btn btn-login-main btn-admin';
        emailInput.classList.add('admin-focus');
        document.getElementById('loginPassword').classList.add('admin-focus');
        if (regPrompt) regPrompt.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof LifeLinkAPI !== 'undefined') LifeLinkAPI.init();
      if (typeof Auth !== 'undefined') Auth.init();

      // Lock input styles against browser autofill yellow tone
      const lockInputStyles = (input) => {
        if (!input) return;
        ['animationstart', 'input', 'change', 'focus', 'blur', 'mouseenter'].forEach(ev => {
          input.addEventListener(ev, () => {
            input.style.setProperty('background-color', '#111422', 'important');
            input.style.setProperty('color', '#ffffff', 'important');
            input.style.setProperty('-webkit-text-fill-color', '#ffffff', 'important');
          });
        });
      };
      lockInputStyles(document.getElementById('loginEmail'));
      lockInputStyles(document.getElementById('loginPassword'));

      // Continuous active enforcer against browser autofill yellow highlights
      const forceDarkInputs = () => {
        const emailEl = document.getElementById('loginEmail');
        const passEl = document.getElementById('loginPassword');
        [emailEl, passEl].forEach(input => {
          if (input) {
            input.style.setProperty('background-color', '#111422', 'important');
            input.style.setProperty('box-shadow', '0 0 0 1000px #111422 inset', 'important');
            input.style.setProperty('-webkit-box-shadow', '0 0 0 1000px #111422 inset', 'important');
            input.style.setProperty('color', '#ffffff', 'important');
            input.style.setProperty('-webkit-text-fill-color', '#ffffff', 'important');
            input.style.setProperty('caret-color', '#ffffff', 'important');
          }
        });
      };
      forceDarkInputs();
      setInterval(forceDarkInputs, 50);

      // Login form submission
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitLoginBtn');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.textContent = 'Authenticating...';

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const role = document.getElementById('loginRole').value;

        if (password.length < 8 || password.length > 12) {
          if (typeof App !== 'undefined' && App.showToast) {
            App.showToast('Password must be between 8 and 12 characters.', 'error');
          } else {
            alert('Password must be between 8 and 12 characters.');
          }
          btn.disabled = false;
          btn.innerHTML = originalText;
          return;
        }

        const result = await Auth.login(email, password, role);
        if (!result) {
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      });
    });
  </script>
</body>
</html>
